[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-ai-agent"
version = "0.1.0"
description = "Multi-agent AI workflow and MCP server for a small e-commerce resale business"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
    "anthropic>=0.40",
    "gspread>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ecom-agent = "ecom_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
